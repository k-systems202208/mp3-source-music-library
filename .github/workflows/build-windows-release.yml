name: Build Windows release

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: windows-latest
    timeout-minutes: 30

    steps:
      - name: Check out source
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.13"

      - name: Install Inno Setup
        shell: pwsh
        run: choco install innosetup --yes --no-progress

      - name: Build and verify installer
        shell: cmd
        working-directory: windows-installer
        env:
          MUSIC_LIBRARY_NONINTERACTIVE: "1"
        run: 00_build_installer.bat

      - name: Upload verified release files
        uses: actions/upload-artifact@v4
        with:
          name: music-library-v2.7.6-release
          path: windows-installer/release/*
          if-no-files-found: error
          retention-days: 7
