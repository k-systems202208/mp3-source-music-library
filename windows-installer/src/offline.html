<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#24392b">
<title>自宅音楽ライブラリ — 接続できません</title>
<style>
  *{box-sizing:border-box}
  html,body{margin:0;min-height:100%;}
  body{display:grid;place-items:center;min-height:100vh;min-height:100dvh;padding:calc(24px + env(safe-area-inset-top)) 20px calc(24px + env(safe-area-inset-bottom));background:#efe8d8;color:#24392b;font-family:system-ui,-apple-system,"Segoe UI",sans-serif;}
  main{width:min(520px,100%);padding:28px 24px;border:1px solid #d8cdb0;border-top:6px solid #a9843c;border-radius:10px;background:#faf6ec;box-shadow:0 16px 50px rgba(36,57,43,.16);text-align:center;}
  img{width:92px;height:92px;border-radius:22px;box-shadow:0 8px 22px rgba(36,57,43,.18);}
  h1{margin:18px 0 8px;font-size:24px;}
  p{margin:8px 0;color:#5b6b5a;line-height:1.7;}
  button{min-height:44px;margin-top:16px;padding:10px 18px;border:0;border-radius:6px;background:#24392b;color:#efe8d8;font:inherit;font-weight:700;cursor:pointer;}
  small{display:block;margin-top:16px;color:#7d6129;line-height:1.6;}
</style>
</head>
<body>
<main>
  <img src="./pwa-icons/icon-192.png" alt="">
  <h1>自宅音楽ライブラリへ接続できません</h1>
  <p>Wi-FiまたはTailscaleの接続を確認してください。</p>
  <p>音楽ファイルやライブラリ情報はスマートフォンへ保存していないため、オフラインでは再生できません。</p>
  <button type="button" onclick="location.reload()">もう一度接続する</button>
  <small>Tailscaleを利用する場合は、Tailscaleアプリが接続状態になっていることも確認してください。</small>
</main>
</body>
</html>
